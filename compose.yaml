services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      postgres:
        condition: service_healthy # wait until the DB accepts connections
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      # Public address of the web app, used in email links and for CORS
      APP_URL: ${APP_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
      # Service names are the hostnames inside the Compose network
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-compta}
      REDIS_URL: redis://redis:6379
      # No value = taken from .env / shell. If missing, the API refuses to start.
      JWT_ACCESS_TOKEN_SECRET:
      JWT_REFRESH_TOKEN_SECRET:
      EMAIL_FROM:
      EMAIL_API_KEY:
    ports:
      - '8000:8000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public API URL, fixed at build time
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    # Hardening: nginx-unprivileged only needs /tmp
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports:
      - '8080:8080'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-compta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432' # loopback only: not reachable from the network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ is resolved inside the container, so it always matches the values above
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s # first start runs initdb, which takes longer

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs durable, never-evicted keys (AOF + noeviction), or queued jobs can be lost
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379' # loopback only: Redis has no password here
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
